<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Test XLSX</title>

https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.jsscript>

</head>
<body>

<h1>Test Excel</h1>

<button onclick="testExcel()">
Lire Excel
</button>

<pre id="result"></pre>

<script>

async function testExcel(){

    try{

        const response = await fetch("data.xlsx");

        const data = await response.arrayBuffer();

        const workbook = XLSX.read(data);

        document.getElementById("result").textContent =
            workbook.SheetNames.join("\n");

    }

    catch(error){

        document.getElementById("result").textContent =
            "Erreur : " + error;

    }

}

</script>

</body>
</html>
