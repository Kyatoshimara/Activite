<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Commercial Forbo</title>

<script src.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.jsscript>

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#f5f7fa;
}

header{
    background:#0072CE;
    color:white;
    padding:20px;
}

.tabs{
    display:flex;
    gap:10px;
    padding:10px;
    background:white;
}

.tab{
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    background:#eaf4ff;
}

.section{
    display:none;
    padding:20px;
}

.section.active{
    display:block;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin:10px 0;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    border-bottom:1px solid #eee;
    padding:10px;
    text-align:left;
}

select{
    width:100%;
    padding:12px;
    border-radius:8px;
}
</style>

</head>
<body>

<header>
<h1>📊 Dashboard Commercial Ludovic Aumont</h1>
<p>Forbo Flooring Systems</p>
</header>

<div class="tabs">
    <div class="tab" onclick="showTab('dashboard')">📊 Dashboard</div>
    <div class="tab" onclick="showTab('clients')">👥 Clients</div>
    <div class="tab" onclick="showTab('commandes')">📦 Commandes</div>
    <div class="tab" onclick="showTab('produits')">🎨 Produits</div>
    <div class="tab" onclick="showTab('ratios')">🧪 Ratios</div>
</div>

<div id="dashboard" class="section active">
    <div class="card">
        <h2>Indicateurs globaux</h2>
        <div id="globalStats"></div>
    </div>
</div>

<div id="clients" class="section">
    <div class="card">

        <h2>Analyse Client</h2>

        <select id="clientSelect"></select>

        <div id="clientDetails"></div>

    </div>
</div>

<div id="commandes" class="section">
    <div class="card">
        <h2>Commandes en cours</h2>
        <div id="commandesTable"></div>
    </div>
</div>

<div id="produits" class="section">
    <div class="card">
        <h2>Produits</h2>
        <div id="produitsTable"></div>
    </div>
</div>

<div id="ratios" class="section">
    <div class="card">
        <h2>Ratios Echantillons</h2>
        <div id="ratiosTable"></div>
    </div>
</div>

<script>

function showTab(id){

document.querySelectorAll('.section')
.forEach(s => s.classList.remove('active'));

document.getElementById(id)
.classList.add('active');

}

async function loadExcel(){

const response = await fetch(
'Synthèse activité L. Aumont (2).xlsx'
);

const data = await response.arrayBuffer();

const workbook =
XLSX.read(data);

console.log(workbook.SheetNames);

const clientsSheet =
workbook.Sheets['Clients AAJ'];

const clients =
XLSX.utils.sheet_to_json(clientsSheet,{header:1});

console.log(clients);

/*
ICI on peuple :

- Dashboard global
- Liste clients
- Tableau commandes
- Tableau produits
- Tableau ratios

à partir des feuilles :

Clients AAJ
Produit AAJ
Cdes en cours
Ratio Echant

*/

}

loadExcel();

</script>

</body>
</html>
