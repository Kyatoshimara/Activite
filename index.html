<head>

<style>
body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#f5f7fa;
}

header{
    background:#0072CE;
    color:white;
    padding:25px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
}
</style>

</head>

<body>
    <button onclick="chargerExcel()">
Lire Excel
</button>

<pre id="resultat"></pre>

<header>
<h1>📊 Dashboard Commercial</h1>
<p>Ludovic Aumont | Forbo Flooring Systems</p>
</header>

<div class="container">

<div class="card">
<h2>✅ GitHub Pages fonctionne</h2>

<p>
Si tu vois ce message, alors le problème venait du précédent fichier HTML.
</p>

<p>
Le prochain objectif sera de connecter automatiquement
le fichier Excel :
<strong>Synthèse activité L. Aumont (2).xlsx</strong>
</p>

</div>

</div>
<script>

async function chargerExcel(){

    try{

        const response = await fetch("data.xlsx");

        const data =
        await response.arrayBuffer();

        const workbook =
        XLSX.read(data);

        document.getElementById(
            "resultat"
        ).textContent =
        workbook.SheetNames.join("\n");

    }

    catch(error){

        document.getElementById(
            "resultat"
        ).textContent =
        error;

    }

}

</script>
</body>
